
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FashionStore</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f0e8;
            color: #3e2c23;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 25px #00000012;
        }

        h1 {
            text-align: center;
            font-family: Georgia, serif;
        }

        .subtitle {
            text-align: center;
            color: #77685d;
            margin-bottom: 25px;
        }

        form p {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d7c9b9;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #654735;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #493022;
        }

        a {
            color: #654735;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .errorlist {
            color: #b42318;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h1>FashionStore</h1>
        <p class="subtitle">Welcome back! Please login.</p>

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Login</button>
        </form>

        <div class="links">
            <p>Don't have an account?
                <a href="{% url 'signup' %}">Sign Up</a>
            </p>

            <a href="{% url 'home' %}">Back to Home</a>
        </div>
    </div>
</body>
</html>
